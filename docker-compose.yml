networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  app:
    image: traefik/whoami:latest
    container_name: devops_app
    networks:
      proxy-net:
        ipv4_address: 172.20.0.10

  nginx1:
    image: nginx:1.25-alpine
    container_name: devops_nginx1
    ports:
      - "8081:80"
    environment:
      UPSTREAM_TARGET: "app:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    networks:
      proxy-net:
        ipv4_address: 172.20.0.11
    depends_on:
      - app

  nginx2:
    image: nginx:1.25-alpine
    container_name: devops_nginx2
    ports:
      - "8082:80"
    environment:
      UPSTREAM_TARGET: "nginx1:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    networks:
      proxy-net:
        ipv4_address: 172.20.0.12
    depends_on:
      - nginx1

  nginx3:
    image: nginx:1.25-alpine
    container_name: devops_nginx3
    ports:
      - "8083:80"
    environment:
      UPSTREAM_TARGET: "nginx2:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    networks:
      proxy-net:
        ipv4_address: 172.20.0.13
    depends_on:
      - nginx2
